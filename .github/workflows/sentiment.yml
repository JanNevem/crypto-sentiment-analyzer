name: Bitcoin Sentiment Check

on:
  workflow_dispatch:
  schedule:
    # GitHub may delay scheduled jobs; this is not a tick-precise timer.
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: bitcoin-sentiment-state
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out analyzer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore previous sentiment state
        uses: actions/cache/restore@v4
        with:
          path: |
            sentiment_state.json
            visual_state.json
            signal_history.json
            oi_cache.json
          key: sentiment-state-${{ github.run_id }}
          restore-keys: |
            sentiment-state-

      - name: Run one analysis cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --once

      - name: Save current sentiment state to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            sentiment_state.json
            visual_state.json
            signal_history.json
            oi_cache.json
          key: sentiment-state-${{ github.run_id }}

      - name: Commit fresh dashboard state
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- visual_state.json sentiment_state.json signal_history.json oi_cache.json)" ]; then
            echo "No dashboard state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in visual_state.json sentiment_state.json signal_history.json oi_cache.json; do
            [ -e "$file" ] && git add "$file"
          done
          git commit -m "chore: update sentiment dashboard state"
          git push
